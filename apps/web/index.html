<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1324" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShieldQuest — An interactive, scenario-based youth crime-prevention adventure game. Experience consequences, understand social pressure, and protect someone else." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShieldQuest — Choose Right. Protect Together." />
    <meta property="og:description" content="An interactive scenario-based youth crime-prevention game developed by SecurePi from Nanyang Polytechnic." />
    <meta property="og:site_name" content="ShieldQuest" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>ShieldQuest — Choose Right. Protect Together.</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme before first paint so the wrong palette never flashes -->
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('shieldquest-theme')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  </head>
  <body class="bg-shield-void text-shield-cream antialiased selection:bg-shield-gold/40 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
