<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShieldQuest · Habbo-style vertical slice</title>
<style>html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#1b2330}
#prompt{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;display:none;font:600 14px Outfit,sans-serif;color:#fff7e0;background:#20303c;border:2px solid #0d151c;box-shadow:inset 0 0 0 1px #3f5a6b;border-radius:6px;padding:7px 12px}
#prompt kbd{display:inline-block;background:#f2c14e;color:#20303c;border-radius:3px;padding:0 6px;margin-right:6px;border-bottom:2px solid #a8801f}</style></head>
<body><div id="game"></div><div id="prompt"></div>
<script type="module">
// Dev harness for the vertical slice: the real Phaser scenes, without the React HUD (only its interaction prompt).
import { mountGame } from '../src/game/main'
import { GameBridge } from '../src/game/events'
import { baseAvatar } from '../src/state/avatar'
import { loadPlayerArt } from '../src/game/playerArt'
import { PRECINCT_SPAWN } from '../src/game/precinct'
import { SHOP_SPAWN } from '../src/game/locations'
const q = new URLSearchParams(location.search), scene = q.get('scene') ?? 'Precinct'
const bridge = new GameBridge(); await loadPlayerArt()
const prompt = document.querySelector('#prompt')
bridge.on('proximity', h => { prompt.style.display = h ? 'block' : 'none'; if (h) prompt.innerHTML = `<kbd>E</kbd>${h.label}` })
bridge.on('ready', () => { window.__sliceReady = true })
mountGame(document.querySelector('#game'), { avatar: baseAvatar, name: 'YOU', scene, position: scene === 'Minimart' ? SHOP_SPAWN : PRECINCT_SPAWN, reducedMotion: q.has('still'), bridge })
window.__slice = { bridge }
</script></body></html>
