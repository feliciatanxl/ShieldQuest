services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shieldquest
      POSTGRES_PASSWORD: shieldquest_local
      POSTGRES_DB: shieldquest
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - shieldquest_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shieldquest -d shieldquest']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shieldquest_data:
