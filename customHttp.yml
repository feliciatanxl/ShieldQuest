# AWS Amplify Hosting custom headers (read from the repo root at build time).
# Unity Web build: export with Compression Format = Disabled and let Amplify/CloudFront compress,
# so no Content-Encoding overrides are needed. If you switch to Brotli/Gzip, add
# Content-Encoding: br|gzip for the matching *.br / *.gz files instead.
customHeaders:
  - pattern: '/unity/Build/*.wasm'
    headers:
      - key: Content-Type
        value: application/wasm
  - pattern: '/unity/Build/*.loader.js'
    headers:
      # loader names don't change between builds; never serve a stale one
      - key: Cache-Control
        value: no-cache
  - pattern: '/unity/Build/*'
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: '/manifest.webmanifest'
    headers:
      - key: Content-Type
        value: application/manifest+json
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
