<!--
  ShieldQuest mark.

  This must match `BrandMark.tsx` exactly: a navy gradient rounded square with
  an amber shield, using the canonical navy-900 -> navy-950 gradient and
  amber-400 from tokens.css.

  The previous favicon was the last surviving artifact of the pre-rebrand
  olive/cream theme (#285e48 green, #efd58d sand, and a four-point star instead
  of a shield). Because nothing else in the product used those colours any
  more, it read in the browser tab as a random stock icon rather than as this
  product's logo.

  Keep the geometry inside the middle ~60% so the same artwork survives being
  masked to a circle on Android.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ShieldQuest">
  <defs>
    <linearGradient id="sq-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545" />
      <stop offset="1" stop-color="#061527" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#sq-navy)" />

  <!-- Lucide "shield" outline, scaled to sit centred in the tile. -->
  <g transform="translate(21 20) scale(2.42)" fill="none" stroke="#f2ae33"
     stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  </g>
</svg>
