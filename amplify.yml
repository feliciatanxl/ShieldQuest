version: 1
frontend:
  phases:
    preBuild:
      commands:
        # package.json "engines" requires Node >= 20
        - nvm use 20 || nvm install 20
        - npm ci
    build:
      commands:
        # Frontend only: the web app imports the compiled shared package, so build it first.
        # The Express API (apps/api) is not deployed by Amplify static hosting.
        - npm run build:shared
        - npm run build:web
  artifacts:
    # Vite's default outDir, relative to the repo root where these commands run
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
